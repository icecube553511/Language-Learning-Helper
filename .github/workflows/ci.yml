name: dual-platform-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts-and-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install content verification dependencies
        run: python -m pip install -r tools/requirements-content.txt
      - name: Verify shared contracts
        run: python tools/verify_sync.py
      - name: Install Windows dependencies
        run: python -m pip install -r windows/requirements-build.txt
      - name: Test Windows client
        run: python -m unittest discover -s windows/tests -v
      - name: Build Windows executable
        shell: pwsh
        run: ./windows/build.ps1
      - name: Smoke test packaged Windows executable
        shell: pwsh
        run: |
          $smokeData = Join-Path $env:RUNNER_TEMP "lexitrack-smoke"
          $process = Start-Process -FilePath "./windows/dist/LexiTrack.exe" -ArgumentList @("--smoke-test", "--data-dir", $smokeData) -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Packaged smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Generate Windows checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "./windows/dist/LexiTrack.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LexiTrack.exe" | Set-Content "./windows/dist/SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: lexitrack-windows-${{ github.sha }}
          path: |
            windows/dist/LexiTrack.exe
            windows/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test Android client
        working-directory: android
        run: ./gradlew test lintDebug assembleDebug
      - name: Generate Android checksum
        working-directory: android/app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: lexitrack-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
