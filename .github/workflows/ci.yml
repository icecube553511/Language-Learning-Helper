name: dual-platform-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts-and-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify shared contracts
        run: python tools/verify_sync.py
      - name: Test Windows client
        run: python -m unittest discover -s windows/tests -v

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test Android client
        working-directory: android
        run: ./gradlew test lintDebug assembleDebug
